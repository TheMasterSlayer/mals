# Dev profile — uses H2 in-memory DB so no external Postgres is needed.
# Activate with: -Dspring.profiles.active=dev

spring:
  datasource:
    url: jdbc:h2:mem:mals_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  # H2 web console (http://localhost:8080/h2-console)
  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  secret: dev-secret-key-for-local-testing-only-not-production
  expiration: 86400000

cors:
  allowed-origins: http://localhost:3000

logging:
  level:
    com.mals: DEBUG
