server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: mals-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mals_db}
    username: ${DB_USERNAME:mals_user}
    password: ${DB_PASSWORD:mals_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
    open-in-view: false

# JWT configuration
jwt:
  secret: ${JWT_SECRET:mals-super-secret-jwt-key-change-this-in-production-32ch}
  expiration: ${JWT_EXPIRATION:86400000}

# CORS configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    com.mals: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
